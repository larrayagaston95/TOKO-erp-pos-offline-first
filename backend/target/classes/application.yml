# ============================================================================
# CONFIGURACIÓN DE LA APLICACIÓN - TOKO ERP BACKEND
# ============================================================================
# Copia este archivo como application.yml y ajusta los valores de conexión
# según tu entorno. NUNCA comitees credenciales reales al repositorio.

spring:

  application:
    name: toko-erp-backend

  # ── Conexión a PostgreSQL ─────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/toko_erp
    username: postgres
    password: Flux-S0ft
    driver-class-name: org.postgresql.Driver
    # Pool de conexiones HikariCP (valores recomendados para desarrollo)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ── JPA / Hibernate ───────────────────────────────────────────────────────
  jpa:
    # Usa 'validate' en producción. 'update' es conveniente para desarrollo.
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Tipos UUID nativos de PostgreSQL
        jdbc:
          lob:
            non_contextual_creation: true

# ── Servidor embebido ─────────────────────────────────────────────────────────
server:
  port: 8082
  servlet:
    context-path: /

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.toko.erp: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
